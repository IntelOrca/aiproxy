name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type-check
        run: deno check main.ts

      - name: Test
        run: deno test --allow-net --allow-read --allow-env

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t aiproxy:ci .
